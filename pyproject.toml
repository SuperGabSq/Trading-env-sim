[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-env-sim"
version = "0.1.0"
description = "Local futures trading simulator: charts, manual paper trading, bar replay, backtesting, bot API and live paper trading."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6",
    "tzdata>=2024.1",
    "websockets>=12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
databento = ["databento>=0.40"]
ibkr = ["ib_async>=1.0"]

[project.scripts]
tsim = "sim.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

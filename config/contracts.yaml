  # ---- Forex (spot, as traded at an ECN broker) -------------------------------------------------
  # Quantity 1 = one micro lot of 1,000 units of the base currency; 10 = mini lot, 100 = standard lot.
  # Prices have 5 decimals (3 for JPY pairs); one tick is a pipette, a tenth of a pip.
  # Margin: EU retail leverage (ESMA) 1:30 on majors, 1:20 on gold; stop-out at half of that.
  # Fees: $3.50 per side per standard lot ($0.035 per micro lot). Spreads are raw ECN spreads in
  # pipettes; Dukascopy downloads report the measured median spread so you can tune them.
  # Not modelled: overnight swap (rollover interest).
  _forex: &forex
    asset_class: forex
    unit: micro lot (1,000 units)
    exchange: FX
    session: forex_24x5
    months: ""
    perpetual: true
    margin: {initial_rate: 0.0334, maintenance_rate: 0.0167}
    fees_per_side: 0.035

  EURUSD:
    <<: *forex
    name: Euro / US Dollar
    tick_size: 0.00001
    tick_value: 0.01
    spread_ticks: {rth: 2, eth: 5, open: 5}
    data: {dukascopy: EURUSD, point: 100000}

  GBPUSD:
    <<: *forex
    name: British Pound / US Dollar
    tick_size: 0.00001
    tick_value: 0.01
    spread_ticks: {rth: 4, eth: 10, open: 8}
    data: {dukascopy: GBPUSD, point: 100000}

  USDJPY:
    <<: *forex
    name: US Dollar / Japanese Yen
    tick_size: 0.001
    tick_value: 1.0          # 1 JPY per pipette per micro lot, converted to USD at the current rate
    quote: JPY
    spread_ticks: {rth: 3, eth: 8, open: 6}
    data: {dukascopy: USDJPY, point: 1000}

  AUDUSD:
    <<: *forex

# Contract registry.
#
# Margins and fees are APPROXIMATE starting values. Exchange margins change often and every broker
# sets its own day-trade margin and commission, so edit these to match your broker.
#
#   tick_size        minimum price increment
#   tick_value       USD value of one tick for one contract   (point value = tick_value / tick_size)
#   margin.intraday  margin per contract while the day-trade window is open
#   margin.initial   overnight margin per contract (applies from session.day_margin_end until the next open)
#   margin.maintenance  equity per contract below which an overnight position is liquidated
#   fees_per_side    commission + exchange + clearing + NFA, per contract, per side
#   spread_ticks     typical bid-ask spread in ticks: regular hours, overnight, and the first minute after
#                    the regular-hours open. Market/stop orders pay half of it (rounded up to a tick)
#                    unless a live feed provides real quotes.
#   roll_days        calendar days before expiry when the continuous series moves to the next contract
#   synthetic        parameters for the sample-data generator only
#
# Non-futures instruments use the same fields, plus:
#   asset_class      future | crypto | forex | stock | etf   (groups symbols in the app)
#   unit             what a quantity of 1 means: a contract, a share, a micro lot of 1,000 units...
#   quote            currency of prices and tick_value. Non-USD (USDJPY -> JPY) means profit is
#                    converted to USD at the current price.
#   margin.*_rate    margin as a fraction of notional value. intraday_rate applies until
#                    session.day_margin_end (stocks: 4x day-trading buying power, 2x overnight)
#   fees_per_side_rate  fee as a fraction of notional, per side (added to fees_per_side)
#   data             where the free downloader gets history (Binance symbol, Dukascopy code...)

sessions:
  cme_equity:
    tz: America/Chicago
    open: "17:00"           # the session opens the previous evening (Sun 17:00 opens Monday's session)
    close: "16:00"
    open_days: [sun, mon, tue, wed, thu]
    rth: ["08:30", "15:00"]
    day_margin_end: "15:45" # after this time overnight (initial) margin applies
  cme_metals_energy:
    tz: America/Chicago
    open: "17:00"
    close: "16:00"
    open_days: [sun, mon, tue, wed, thu]
    rth: ["08:20", "13:30"]
    day_margin_end: "15:45"
  crypto_24x7:
    tz: UTC
    open: "00:00"
    close: "24:00"
    open_days: [sun, mon, tue, wed, thu, fri, sat]
    rth: ["00:00", "24:00"]
    day_margin_end: null    # crypto perps: one margin level all the time
  forex_24x5:
    tz: America/New_York
    open: "17:00"           # Sunday 17:00 New York opens Monday's session; each day rolls over at 17:00
    close: "17:00"
    open_days: [sun, mon, tue, wed, thu]
    rth: ["03:00", "12:00"] # London open to New York midday: the most liquid hours
    day_margin_end: null
  metals_spot:
    tz: America/New_York
    open: "18:00"           # spot gold: daily one-hour break at 17:00-18:00 New York
    close: "17:00"
    open_days: [sun, mon, tue, wed, thu]
    rth: ["08:20", "13:30"] # COMEX pit hours, when gold is most active
    day_margin_end: null
  us_equity:
    tz: America/New_York
    open: "04:00"           # pre-market from 04:00, regular hours 09:30-16:00, after-hours until 20:00
    close: "20:00"
    open_days: [mon, tue, wed, thu, fri]
    rth: ["09:30", "16:00"]
    day_margin_end: "16:00" # day-trading margin (4x) during regular hours, overnight margin (2x) after


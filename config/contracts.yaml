  # ---- US stocks and ETFs ---------------------------------------------------------------------
  # Quantity = shares. Prices are split-adjusted when downloaded. Margin follows Reg T: 4x buying
  # power during regular hours (pattern day trader, $25k+ accounts), 2x overnight, 25% maintenance.
  # Fees: $0.005 per share per side (Interactive Brokers fixed; set 0 for commission-free brokers).
  # Not modelled: short borrow fees, dividends, halts, the $1 minimum commission.
  _stock: &stock
    asset_class: stock
    unit: share
    exchange: NASDAQ
    session: us_equity
    months: ""
    perpetual: true
    tick_size: 0.01
    tick_value: 0.01
    margin: {initial_rate: 0.5, maintenance_rate: 0.25, intraday_rate: 0.25}
    fees_per_side: 0.005
    spread_ticks: {rth: 1, eth: 4, open: 3}
